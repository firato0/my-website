<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hintergrundbild mit Text</title>
    <style>
        /* Hintergrundstil */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png'); /* Dein Hintergrundbild */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: flex-end; /* Platziert das Textfeld rechts */
            align-items: center; /* Vertikal mittig */
        }

        /* Transparentes Textfeld */
        .text-box {
            background-color: rgba(255, 255, 255, 0.5); /* Halbtransparentes Weiß */
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            color: black;
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Transparentes Textfeld -->
    <div class="text-box">
        Im 18 years old
    </div>
</body>
</html>
