<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png'); /* Dein Hintergrundbild */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
        }

        /* Besucherzähler in der oberen Ecke */
        .visitor-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            font-size: 20px;
            border-radius: 5px;
        }

        .text-box {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(0%, -50%) translateX(30px); /* Verschiebung nach rechts */
            padding: 20px;
            color: white;
            font-size: 20px;
            font-family: 'Belladonna', serif;
            text-align: center;
            background: none; /* Hintergrund entfernt */
            border: none; /* Rahmen entfernt */
            box-shadow: none; /* Schatten entfernt */
        }

        .text-box h3 {
            margin: 10px 0;
            font-size: 18px;
        }

        .text-box p {
            margin: 5px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- Besucherzähler in der oberen Ecke -->
    <div class="visitor-counter" id="visitorCounter">Loading...</div>

    <!-- Textfeld -->
    <div class="text-box">
        <h3>ᡣ𐭩 ⊹˚. * ── ✿ ── . ݁₊ ⊹ . ݁˖</h3>
        <p>@{Just call me Guts} ઇ</p>
        <p>ᡣ𐭩 ⊹˚. * ── ✿ ── . ݁₊ ⊹ . ݁˖</p>
    </div>

    <script>
        // Besucherzähler
        function updateVisitorCount() {
            let count = localStorage.getItem('visitorCount');
            if (!count) {
                count = 0;
            }
            count++;
            localStorage.setItem('visitorCount', count);
            document.getElementById('visitorCounter').textContent = `Visitors: ${count}`;
        }

        updateVisitorCount();
    </script>
</body>
</html>
