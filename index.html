<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hintergrund mit Musik</title>
    <style>
        /* Hintergrundstil */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png'); /* Dein Hintergrundbild */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Musik Player sichtbar */
        audio {
            width: 300px;
            margin-top: 20px;
        }

        /* Lautstärkeregler */
        .volume-control {
            margin-top: 10px;
            width: 300px;
        }
    </style>
</head>
<body>
    <!-- Musik einbetten -->
    <audio id="audio" autoplay loop>
        <source src="free-lofi-type-beat-evening-stroll-209514.mp3" type="audio/mp3">
        Dein Browser unterstützt das Audio-Element nicht.
    </audio>

    <!-- Lautstärkeregler -->
    <input class="volume-control" type="range" id="volume" min="0" max="1" step="0.01" value="0.6">

    <script>
        // Lautstärkeregler hinzufügen
        const audio = document.getElementById("audio");
        const volumeControl = document.getElementById("volume");

        // Lautstärke mit Schieberegler einstellen
        volumeControl.addEventListener("input", (e) => {
            audio.volume = e.target.value;
        });
    </script>
</body>
</html>
