<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png'); /* Dein Hintergrundbild */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 50px;
            flex-direction: column;
        }

        .visitor-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            font-size: 20px;
            border-radius: 5px;
        }

        .about-me {
            color: white;
            font-size: 22px;
            font-family: 'Belladonna', serif;
            text-align: left;
            background: none;
            border: none;
            box-shadow: none;
            line-height: 1.5;
        }

        audio {
            display: none; /* Audio-Player ausblenden */
        }

        /* Container für Biene und Katze nebeneinander */
        .bottom-content {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; /* Abstand zwischen Biene und Katze */
        }

        /* ASCII-Bild der Biene */
        .bee-image {
            color: white;
            font-family: monospace;
            font-size: 24px;
            white-space: pre;
        }

        /* Text "look, a bee!" */
        .bee-text {
            color: white;
            font-family: monospace;
            font-size: 24px;
        }

        /* ASCII-Bild der Katze */
        .cat-image {
            color: white;
            font-family: monospace;
            font-size: 24px;
            white-space: pre;
        }
    </style>
</head>
<body>
    <!-- Besucherzähler in der oberen Ecke -->
    <div class="visitor-counter" id="visitorCounter">Loading...</div>

    <!-- About Me Liste -->
    <div class="about-me">
        ⚫Name⚫: Guts⚫<br>
        ⚫Age⚫: 18<br>
        ⚫Birthday⚫: 13.07.2006<br>
        ⚫Favorite Anime⚫: Berserk<br>
        ⚫Games⚫: Valorant (Guts#izana)
    </div>

    <!-- Hintergrundmusik -->
    <audio id="bgMusic" autoplay loop>
        <source src="good-night-lofi-cozy-chill-music-160166.mp3" type="audio/mpeg">
        Dein Browser unterstützt keine Hintergrundmusik.
    </audio>

    <!-- Container für die Biene und die Katze nebeneinander -->
    <div class="bottom-content">
        <!-- ASCII-Bild der Biene -->
        <div class="bee-image">
            ⋆˚🐝˖
        </div>
        <!-- Text "look, a bee!" -->
        <div class="bee-text">
            look, a bee!
        </div>
        <!-- ASCII-Bild der Katze -->
        <div class="cat-image">
            ╱|、<br>
            (˚ˎ 。7<br>
            |、˜〵<br>
            じしˍ,)ノ
        </div>
    </div>

    <script>
        // Besucherzähler aktualisieren
        function updateVisitorCount() {
            let count = localStorage.getItem('visitorCount');
            if (!count) {
                count = 0;
            }
            count++;
            localStorage.setItem('visitorCount', count);
            document.getElementById('visitorCounter').textContent = `Visitors: ${count}`;
        }

        updateVisitorCount();
    </script>
</body>
</html>
