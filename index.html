<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png'); /* Hintergrundbild */
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        audio {
            position: fixed;
            bottom: 10px;
            left: 10px;
        }
        a {
            color: blue; /* Der Link wird blau angezeigt */
            text-decoration: underline; /* Der Link wird unterstrichen */
        }
        a:hover {
            color: darkblue; /* Wenn der Link mit der Maus überfahren wird, ändert sich die Farbe */
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Willkommen auf meiner Website!</h1>
        <p>Genieße die Atmosphäre!</p>
        <p>Besuche meine Website: <a href="https://www.example.com" target="_blank">my-website</a></p> <!-- Dein Link hier -->
    </div>
