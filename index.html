<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hintergrund mit Musik</title>
    <style>
        /* Hintergrundstil */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png'); /* Dein Hintergrundbild */
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>
    <!-- Musik einbetten -->
    <audio autoplay loop>
        <source src="free-lofi-type-beat-evening-stroll-209514.mp3" type="audio/mp3">
        Dein Browser unterstützt das Audio-Element nicht.
    </audio>
</body>
</html>
