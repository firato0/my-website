<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berserk Website</title>
    <style>
        /* Hintergrundvideo-Styling */
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Allgemeine Stile */
        body {
            margin: 0;
            padding: 0;
            color: white;
            font-family: 'Arial', sans-serif;
            background-color: black;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-top: 20%;
        }

        p {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 20px;
        }

        /* Audio-Element */
        audio {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background-color: black;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- TikTok-Video (mit iframe eingebettet) -->
    <iframe src="https://www.tiktok.com/embed/DEIN_RAW_LINK_HIER" width="325" height="578" frameborder="0" allowfullscreen></iframe>

    <!-- Titel und Text -->
    <h1>Berserk - Die Dunkelheit der Welt</h1>
    <p>Willkommen in der düsteren Welt von Guts. Die Geschichte von Berserk ist voller Schmerz und Leid.</p>

    <!-- Musik -->
    <audio controls autoplay loop>
        <source src="dein-musik-link-hier.mp3" type="audio/mp3">
        Dein Browser unterstützt das Abspielen von Audio nicht.
    </audio>

</body>
</html>
