<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png'); /* Dein Hintergrundbild */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 50px;
        }

        /* Besucherzähler in der oberen Ecke */
        .visitor-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            font-size: 20px;
            border-radius: 5px;
        }

        .about-me {
            color: white;
            font-size: 22px;
            font-family: 'Belladonna', serif;
            text-align: left;
            background: none;
            border: none;
            box-shadow: none;
            line-height: 1.5;
        }

        /* Text unten rechts */
        .bee-text {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: white;
            font-size: 18px;
            font-family: 'Belladonna', serif;
            text-align: right;
            line-height: 1.5;
            background: none;
            border: none;
            box-shadow: none;
        }

        /* Audio-Player Styling */
        audio {
            display: none; /* Audio-Player ausblenden */
        }
    </style>
</head>
<body>
    <!-- Besucherzähler in der oberen Ecke -->
    <div class="visitor-counter" id="visitorCounter">Loading...</div>

    <!-- About Me Liste -->
    <div class="about-me">
        ⚫Name⚫: Guts⚫<br>
        ⚫Age⚫: 18<br>
        ⚫Birthday⚫: 13.07.2006<br>
        ⚫Favorite Anime⚫: Berserk<br>
        ⚫Games⚫: Valorant (Guts#izana)
    </div>

    <!-- Text unten rechts -->
    <div class="bee-text">
        ╱|、<br>
        (˚ˎ 。7 <br>
        |、˜〵 <br>
        じしˍ,)ノ
    </div>

    <!-- Hintergrundmusik (FluxFM Stream) -->
    <audio autoplay loop>
        <source src="https://fluxfm.streamabc.net/flx-chillhop-mp3-128-8581707?sABC=67o136s5%230%23rq2s32rp5764rr1r9p54r6n23q3o00q5%23fgernzf.syhksz.qr&aw_0_1st.playerid=streams.fluxfm.de&amsparams=playerid:streams.fluxfm.de;skey:1739667189" type="audio/mpeg">
        Dein Browser unterstützt keine Hintergrundmusik.
    </audio>

    <script>
        // Besucherzähler
        function updateVisitorCount() {
            let count = localStorage.getItem('visitorCount');
            if (!count) {
                count = 0;
            }
            count++;
            localStorage.setItem('visitorCount', count);
            document.getElementById('visitorCounter').textContent = `Visitors: ${count}`;
        }

        // Zähler zurücksetzen (nur zum Testen oder beim Laden)
        function resetVisitorCount() {
            localStorage.removeItem('visitorCount');
            location.reload();
        }

        // Reset aufrufen, falls gewünscht
        resetVisitorCount();

        updateVisitorCount();
    </script>
</body>
</html>
