<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hintergrundbild mit Text</title>
    <style>
        /* Hintergrundstil */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png'); /* Dein Hintergrundbild */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center; /* Zentriert das Textfeld horizontal */
            align-items: center; /* Zentriert das Textfeld vertikal */
        }

        /* Textfeld mit unsichtbarem Hintergrund */
        .text-box {
            background-color: transparent; /* Der Hintergrund des Textes ist unsichtbar */
            padding: 20px;
            font-size: 24px;
            color: black;
            font-family: Arial, sans-serif;
            text-align: center;
            position: relative;
            left: 20px; /* Leicht nach rechts verschoben */
        }
    </style>
</head>
<body>
    <!-- Textfeld mit unsichtbarem Hintergrund -->
    <div class="text-box">
        Im 18 years old
    </div>
</body>
</html>
