<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website</title>
    <style>
        /* Google Font importieren */
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            background-image: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 255, 0.5) 100%);
            font-family: 'Roboto Slab', serif; /* Schriftart */
        }

        /* Animiertes Hintergrundbild im Vollbild und komplett sichtbar */
        .background-image {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            background-image: url('https://media1.tenor.com/m/Dls3ERucnB8AAAAC/guts-waiting.gif');
            background-size: contain; /* Skaliert so, dass das gesamte Bild sichtbar bleibt */
            background-position: center;
            background-repeat: no-repeat;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        /* Linke Seite - "About Me" Text */
        .about-me {
            color: white;
            font-size: 24px;
            text-align: left;
            position: absolute;
            left: 20px;
            top: 20px;
            z-index: 1;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            display: inline-block;
        }

        .about-me p {
            margin-bottom: 20px; /* Abstand zwischen den Textabschnitten */
        }

        .about-me .emoji {
            margin-right: 10px;
        }

        /* Besucherzähler in der oberen Ecke */
        .visitor-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            font-size: 20px;
            border-radius: 5px;
        }
    </style>
    <!-- Firebase SDK importieren -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>
</head>
<body>
    <!-- Animiertes Hintergrundbild -->
    <div class="background-image"></div>

    <!-- About Me Text auf der linken Seite -->
    <div class="about-me">
        <p><span class="emoji">👤</span> Im Guts</p>
        <p><span class="emoji">🎂</span> 18 years old</p>
        <p><span class="emoji">📅</span> 13.07.2006</p>
        <p><span class="emoji">🌍</span> Vienna</p>
    </div>

    <!-- Besucherzähler in der oberen Ecke -->
    <div class="visitor-counter" id="visitorCounter">Visitors: Loading...</div>

    <!-- Hintergrundmusik -->
    <audio id="bgMusic" autoplay loop>
        <source src="just-relax-11157.mp3" type="audio/mpeg">
        Dein Browser unterstützt keine Hintergrundmusik.
    </audio>

    <!-- Firebase Initialisierung -->
    <script>
        // Deine Firebase-Konfiguration
        const firebaseConfig = {
            apiKey: "AIzaSyC8jvuDqJd_ezfGmnyJYaA0YGZ8xiYgXZs",
            authDomain: "meine-website-37747.firebaseapp.com",
            projectId: "meine-website-37747",
            storageBucket: "meine-website-37747.firebasestorage.app",
            messagingSenderId: "137161925471",
            appId: "1:137161925471:web:3d7f8697eb2eb6dd464cea",
            measurementId: "G-WKS34X6JCN"
        };

        // Firebase initialisieren
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Besucherzähler-Funktion
        const visitorCountRef = database.ref('visitorCount');
        
        // Besucherzähler von Firebase holen und anzeigen
        visitorCountRef.once('value', (snapshot) => {
            let count = snapshot.val() || 0;
            document.getElementById('visitorCounter').textContent = `Visitors: ${count}`;
            
            // Besucherzähler inkrementieren und speichern
            visitorCountRef.set(count + 1);
        });
    </script>
</body>
</html>
