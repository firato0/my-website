<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
        }

        /* Besucherzähler in der oberen Ecke */
        .visitor-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            font-size: 20px;
            border-radius: 5px;
        }

        .text-box {
            position: absolute;
            top: 30%; /* Text nach oben verschoben */
            left: 50%;
            transform: translate(-50%, -50%) translateX(20px); /* In der Mitte mit Verschiebung nach rechts */
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            color: white;
            font-size: 20px;
            font-family: 'Belladonna', serif;
            border-radius: 10px;
            width: 250px;
            text-align: center;
        }

        .text-box .additional-info {
            margin-top: 10px;
            font-size: 16px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- Besucherzähler in der oberen Ecke -->
    <div class="visitor-counter" id="visitorCounter">Loading...</div>

    <!-- Textfeld -->
    <div class="text-box">
        <!-- Hinzugefügter Text -->
        <div class="additional-info">
            Guts. ˖⁺｡ ˚⋆˙18 ˖⁺｡ ˚⋆˙ 13/07/2006
        </div>
    </div>

    <script>
        // Funktion zur Aktualisierung des Besucherzählers
        function updateVisitorCount() {
            // Holen des aktuellen Zählers aus dem localStorage
            let count = localStorage.getItem('visitorCount');
            if (!count) {
                count = 0;
            }
            count++;

            // Speichern des neuen Zählers im localStorage
            localStorage.setItem('visitorCount', count);

            // Aktualisieren der Anzeige
            document.getElementById('visitorCounter').textContent = `Visitors: ${count}`;
        }

        // Besucherzähler aktualisieren, wenn die Seite geladen wird
        updateVisitorCount();
    </script>
</body>
</html>
