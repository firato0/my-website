<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website mit Ninja</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png'); /* Dein Hintergrundbild */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
        }

        /* Besucherzähler in der oberen Ecke */
        .visitor-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            font-size: 20px;
            border-radius: 5px;
        }

        .text-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateX(20px); /* In der Mitte mit Verschiebung nach rechts */
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            color: white;
            font-size: 20px;
            font-family: 'Belladonna', serif;
            border-radius: 10px;
            width: 250px;
            text-align: center;
        }

        .text-box h3 {
            margin: 10px 0;
            font-size: 18px;
        }

        .text-box p {
            margin: 5px 0;
            font-size: 16px;
        }

        /* Ninja mit Schwert */
        .ninja-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 200px;
            cursor: pointer;
        }

        .ninja {
            position: absolute;
            width: 100px;
            height: 200px;
            background-color: black;
            border-radius: 10px;
            transition: transform 0.5s ease;
        }

        .ninja .head {
            position: absolute;
            top: 10px;
            left: 25px;
            width: 50px;
            height: 50px;
            background-color: #f0c674;
            border-radius: 50%;
        }

        .ninja .sword {
            position: absolute;
            top: 120px;
            left: 25px;
            width: 50px;
            height: 20px;
            background-color: #d8d8d8;
            transform: scaleX(0); /* Startet unsichtbar */
            transition: transform 0.5s ease;
            transform-origin: left;
        }

        .ninja.active .sword {
            transform: scaleX(1); /* Schwert wird sichtbar, wenn 'active' Klasse hinzugefügt wird */
        }

        .ninja .body {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: black;
        }
    </style>
</head>
<body>
    <!-- Besucherzähler in der oberen Ecke -->
    <div class="visitor-counter" id="visitorCounter">Loading...</div>

    <!-- Textfeld -->
    <div class="text-box">
        <h3>ᡣ𐭩 ⊹˚. * ── ✿ ── . ݁₊ ⊹ . ݁˖</h3>
        <p>@{Just call me Guts} ઇ</p>
        <p>ᡣ𐭩 ⊹˚. * ── ✿ ── . ݁₊ ⊹ . ݁˖</p>
    </div>

    <!-- Ninja mit Schwert -->
    <div class="ninja-container" id="ninja">
        <div class="ninja">
            <div class="head"></div>
            <div class="body"></div>
            <div class="sword"></div>
        </div>
    </div>

    <script>
        // Besucherzähler
        function updateVisitorCount() {
            let count = localStorage.getItem('visitorCount');
            if (!count) {
                count = 0;
            }
            count++;
            localStorage.setItem('visitorCount', count);
            document.getElementById('visitorCounter').textContent = `Visitors: ${count}`;
        }

        updateVisitorCount();

        // Ninja-Schwert-Aktion
        const ninja = document.getElementById('ninja');
        ninja.addEventListener('click', () => {
            ninja.querySelector('.ninja').classList.toggle('active');
        });
    </script>
</body>
</html>
