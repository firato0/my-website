<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png'); /* Dein Hintergrundbild */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Besucherzähler in der oberen Ecke */
        .visitor-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            font-size: 20px;
            border-radius: 5px;
        }

        .about-me {
            color: white;
            font-size: 22px;
            font-family: 'Belladonna', serif;
            text-align: center;
            background: none;
            border: none;
            box-shadow: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- Besucherzähler in der oberen Ecke -->
    <div class="visitor-counter" id="visitorCounter">Loading...</div>

    <!-- About Me Liste -->
    <div class="about-me">
        ⚫Name⚫: Guts⚫<br>
        ⚫Age⚫: 18<br>
        ⚫Birthday⚫: 13.07.2006<br>
        ⚫Favorite Anime⚫: Berserk<br>
        ⚫Games⚫: Valorant (Guts#izana)
    </div>

    <script>
        // Besucherzähler
        function updateVisitorCount() {
            let count = localStorage.getItem('visitorCount');
            if (!count) {
                count = 0;
            }
            count++;
            localStorage.setItem('visitorCount', count);
            document.getElementById('visitorCounter').textContent = `Visitors: ${count}`;
        }

        updateVisitorCount();
    </script>
</body>
</html>
