<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('https://i.imgur.com/LJQTB1J.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
        }

        /* Besucherzähler in der oberen Ecke */
        .visitor-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            font-size: 20px;
            border-radius: 5px;
        }

        .text-box {
            position: absolute;
            top: 50%;
            right: 15%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            color: white;
            font-size: 20px;
            font-family: 'Belladonna', serif;
            border-radius: 10px;
            width: 250px;
            text-align: center;
        }

        .text-box h3 {
            margin: 10px 0;
            font-size: 18px;
        }

        .text-box p {
            margin: 5px 0;
            font-size: 16px;
        }

        /* Zusätzliche Anpassungen */
        .text-box p:nth-child(2) {
            margin-top: 20px; /* Abstand zwischen den Absätzen */
            transform: translateY(-10px) translateX(-5px); /* Text leicht nach oben und nach links verschieben */
        }
    </style>
</head>
<body>
    <!-- Besucherzähler in der oberen Ecke -->
    <div class="visitor-counter" id="visitorCounter">Loading...</div>

    <!-- Textfeld -->
    <div class="text-box">
        <h3>I am 18 years old.</h3>
        <p>Berserk is my favorite Anime</p>
        <p>Hop on Valorant: Guts#izana</p>
    </div>

    <script>
        // Funktion zur Aktualisierung des Besucherzählers
        function updateVisitorCount() {
            // Holen des aktuellen Zählers aus dem localStorage
            let count = localStorage.getItem('visitorCount');
            if (!count) {
                count = 0;
            }
            count++;

            // Speichern des neuen Zählers im localStorage
            localStorage.setItem('visitorCount', count);

            // Aktualisieren der Anzeige
            document.getElementById('visitorCounter').textContent = `Visitors: ${count}`;
        }

        // Besucherzähler aktualisieren, wenn die Seite geladen wird
        updateVisitorCount();
    </script>
</body>
</html>
